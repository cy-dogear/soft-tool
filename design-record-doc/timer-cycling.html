<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>循环计时</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #000000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            touch-action: manipulation;
            cursor: pointer;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 24px 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        .percentage-area {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 0;
        }

        #percentNumber {
            font-size: 3rem;
            font-weight: 700;
            font-family: 'Courier New', 'Fira Mono', monospace;
            color: #ffffff;
            background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(255,255,255,0.2);
            line-height: 1;
        }

        #percentSymbol {
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Courier New', 'Fira Mono', monospace;
            color: #ffffff;
            background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(255,255,255,0.2);
            line-height: 1;
        }

        .status-area {
            min-height: 2rem;
            text-align: center;
        }

        #roundStatus {
            font-size: 1rem;
            color: #888;
            letter-spacing: 1px;
            font-weight: 500;
        }

        #completeMessage {
            font-size: 1rem;
            color: #0f0;
            font-weight: 500;
        }

        .inputs-panel {
            display: flex;
            gap: 24px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 0;
        }

        .input-group {
            flex: 1;
            min-width: 120px;
            text-align: center;
        }

        .input-label {
            display: block;
            color: #888;
            font-size: 1rem;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .input-field {
            width: 100%;
            padding: 14px 12px;
            font-size: 3rem;
            font-weight: 600;
            text-align: center;
            background: #1f1f1f;
            border: 1px solid #333;
            border-radius: 16px;
            color: #ffffff;
            font-family: 'Courier New', monospace;
            cursor: text;
            transition: all 0.2s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: #666;
            background: #2a2a2a;
        }

        .input-field.invalid {
            border-color: #ff4444;
            background: #3a1a1a;
        }

        @media (max-width: 480px) {
            .container {
                gap: 20px;
                padding: 20px 16px 32px;
            }
            #percentNumber {
                font-size: 2rem;
            }
            #percentSymbol {
                font-size: 0.85rem;
            }
            .input-field {
                padding: 10px 8px;
                font-size: 2rem;
            }
            .input-label {
                font-size: 0.85rem;
            }
            .status-area {
                min-height: 1.5rem;
            }
            #roundStatus, #completeMessage {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
<div class="container" id="mainContainer">
    <div class="percentage-area">
        <span id="percentNumber">100</span><span id="percentSymbol">%</span>
    </div>
    <div class="status-area">
        <div id="roundStatus"></div>
        <div id="completeMessage"></div>
    </div>
    <div class="inputs-panel">
        <div class="input-group">
            <div class="input-label">倒计时时长（秒）</div>
            <input type="number" class="input-field" id="durationInput" value="30" step="1" min="1">
        </div>
        <div class="input-group">
            <div class="input-label">循环次数</div>
            <input type="number" class="input-field" id="roundsInput" value="2" step="1" min="1">
        </div>
    </div>
</div>

<script>
    (function() {
        // ==================== 常量 ====================
        const DEFAULT_DURATION_SEC = 300;   // 默认300秒（5分钟）
        const DEFAULT_ROUNDS = 2;
        
        const ROUND_END_VOLUME = 0.5;
        const ROUND_END_DURATION = 0.5;
        const ROUND_END_SOUND_TYPE = 'sine';
        const ROUND_END_FREQUENCY = 480;
        
        const STORAGE_KEY_DURATION = 'timer_duration_sec';
        const STORAGE_KEY_ROUNDS = 'timer_rounds';
        
        // ==================== DOM 元素 ====================
        const percentNumber = document.getElementById('percentNumber');
        const roundStatus = document.getElementById('roundStatus');
        const completeMessage = document.getElementById('completeMessage');
        const durationInput = document.getElementById('durationInput');
        const roundsInput = document.getElementById('roundsInput');
        const mainContainer = document.getElementById('mainContainer');
        
        // ==================== 状态变量 ====================
        let durationSec = DEFAULT_DURATION_SEC;      // 每轮倒计时秒数
        let totalSeconds = durationSec;              // 总秒数（等于 durationSec）
        let remainingSeconds = totalSeconds;         // 当前轮剩余秒数
        let totalRounds = DEFAULT_ROUNDS;
        let currentRound = 1;
        let isRunning = false;
        let timerId = null;
        
        // ==================== 音频相关 ====================
        let audioCtx = null;
        let soundOscillator = null;
        let soundGain = null;
        let soundTimeout = null;
        
        // ==================== 音频初始化 ====================
        function initAudio() {
            if (audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {}
        }
        
        // ==================== 播放一轮结束的提示音 ====================
        function playRoundEndSound() {
            if (!audioCtx) {
                initAudio();
            }
            if (!audioCtx) return;
            
            const startSound = () => {
                if (!audioCtx || audioCtx.state !== 'running') return;
                
                try {
                    soundGain = audioCtx.createGain();
                    soundGain.gain.value = ROUND_END_VOLUME;
                    soundGain.connect(audioCtx.destination);
                    
                    soundOscillator = audioCtx.createOscillator();
                    soundOscillator.type = ROUND_END_SOUND_TYPE;
                    soundOscillator.frequency.value = ROUND_END_FREQUENCY;
                    soundOscillator.connect(soundGain);
                    soundOscillator.start();
                    
                    soundTimeout = setTimeout(() => {
                        try {
                            soundOscillator.stop();
                            soundOscillator.disconnect();
                            soundGain.disconnect();
                        } catch (e) {}
                        soundTimeout = null;
                    }, ROUND_END_DURATION * 1000);
                } catch (e) {}
            };
            
            if (audioCtx.state !== 'running') {
                audioCtx.resume().then(() => startSound()).catch(() => {});
            } else {
                startSound();
            }
        }
        
        // ==================== 更新所有显示 ====================
        function updateDisplay() {
            // 1. 更新百分比
            if (totalSeconds === 0) {
                percentNumber.innerText = '0';
            } else {
                const percent = Math.floor((remainingSeconds / totalSeconds) * 100);
                percentNumber.innerText = percent;
            }
            
            // 2. 更新状态文字
            if (!isRunning && currentRound > totalRounds) {
                completeMessage.innerText = '✓ 全部完成';
                roundStatus.innerText = '';
            } else if (isRunning) {
                roundStatus.innerText = `第 ${currentRound} / ${totalRounds} 轮`;
                completeMessage.innerText = '';
            } else {
                roundStatus.innerText = '';
                completeMessage.innerText = '';
            }
        }
        
        // ==================== 停止倒计时 ====================
        function stopTimer() {
            if (timerId) {
                clearInterval(timerId);
                timerId = null;
            }
        }
        
        // ==================== 开始倒计时 ====================
        function startTimer() {
            if (timerId) stopTimer();
            
            timerId = setInterval(() => {
                if (!isRunning) return;
                
                if (remainingSeconds > 0) {
                    remainingSeconds--;
                    updateDisplay();
                    
                    if (remainingSeconds === 0) {
                        // 当前轮结束
                        stopTimer();
                        isRunning = false;
                        playRoundEndSound();
                        
                        currentRound++;
                        
                        if (currentRound > totalRounds) {
                            // 全部完成
                            updateDisplay();
                        } else {
                            // 开始下一轮
                            remainingSeconds = totalSeconds;
                            isRunning = true;
                            updateDisplay();
                            startTimer();
                        }
                    }
                }
            }, 1000);
        }
        
        // ==================== 重置并开始倒计时 ====================
        function resetAndStart() {
            stopTimer();
            currentRound = 1;
            remainingSeconds = totalSeconds;
            isRunning = true;
            updateDisplay();
            startTimer();
            
            if (audioCtx && audioCtx.state !== 'running') {
                audioCtx.resume().catch(() => {});
            }
        }
        
        // ==================== 回到未运行状态 ====================
        function resetToIdle() {
            if (isRunning) {
                stopTimer();
                isRunning = false;
            }
            currentRound = 1;
            remainingSeconds = totalSeconds;
            updateDisplay();
        }
        
        // ==================== 校验并设置时长（秒） ====================
        function validateAndSetDuration(value) {
            const str = String(value).trim();
            if (str === '') return false;
            if (!/^\d+$/.test(str)) return false;
            
            const num = parseInt(str, 10);
            if (isNaN(num) || num <= 0) return false;
            
            durationSec = num;
            totalSeconds = durationSec;      // 直接赋值，不再乘以60
            localStorage.setItem(STORAGE_KEY_DURATION, durationSec);
            
            // 回到未运行状态
            resetToIdle();
            
            return true;
        }
        
        // ==================== 校验并设置循环次数 ====================
        function validateAndSetRounds(value) {
            const str = String(value).trim();
            if (str === '') return false;
            if (!/^\d+$/.test(str)) return false;
            
            const num = parseInt(str, 10);
            if (isNaN(num) || num <= 0) return false;
            
            totalRounds = num;
            localStorage.setItem(STORAGE_KEY_ROUNDS, totalRounds);
            
            // 回到未运行状态
            resetToIdle();
            
            return true;
        }
        
        // ==================== 从 localStorage 加载设置 ====================
        function loadSettings() {
            const savedDuration = localStorage.getItem(STORAGE_KEY_DURATION);
            if (savedDuration !== null && /^\d+$/.test(savedDuration)) {
                const num = parseInt(savedDuration, 10);
                if (!isNaN(num) && num > 0) {
                    durationSec = num;
                    totalSeconds = durationSec;      // 直接赋值
                    durationInput.value = durationSec;
                } else {
                    durationInput.value = DEFAULT_DURATION_SEC;
                }
            } else {
                durationInput.value = DEFAULT_DURATION_SEC;
            }
            
            const savedRounds = localStorage.getItem(STORAGE_KEY_ROUNDS);
            if (savedRounds !== null && /^\d+$/.test(savedRounds)) {
                const num = parseInt(savedRounds, 10);
                if (!isNaN(num) && num > 0) {
                    totalRounds = num;
                    roundsInput.value = totalRounds;
                } else {
                    roundsInput.value = DEFAULT_ROUNDS;
                }
            } else {
                roundsInput.value = DEFAULT_ROUNDS;
            }
            
            // 初始化未运行状态
            currentRound = 1;
            remainingSeconds = totalSeconds;
            isRunning = false;
            updateDisplay();
        }
        
        // ==================== 事件绑定 ====================
        function bindEvents() {
            durationInput.addEventListener('change', (e) => {
                e.stopPropagation();
                const isValid = validateAndSetDuration(e.target.value);
                if (!isValid) {
                    durationInput.classList.add('invalid');
                    durationInput.value = durationSec;
                    setTimeout(() => {
                        durationInput.classList.remove('invalid');
                    }, 2000);
                } else {
                    durationInput.value = durationSec;
                }
            });
            
            roundsInput.addEventListener('change', (e) => {
                e.stopPropagation();
                const isValid = validateAndSetRounds(e.target.value);
                if (!isValid) {
                    roundsInput.classList.add('invalid');
                    roundsInput.value = totalRounds;
                    setTimeout(() => {
                        roundsInput.classList.remove('invalid');
                    }, 2000);
                } else {
                    roundsInput.value = totalRounds;
                }
            });
            
            durationInput.addEventListener('click', (e) => e.stopPropagation());
            roundsInput.addEventListener('click', (e) => e.stopPropagation());
            durationInput.addEventListener('touchstart', (e) => e.stopPropagation());
            roundsInput.addEventListener('touchstart', (e) => e.stopPropagation());
            
            mainContainer.addEventListener('click', (e) => {
                if (e.target === durationInput || e.target === roundsInput) return;
                resetAndStart();
            });
        }
        
        // ==================== 初始化 ====================
        function init() {
            initAudio();
            loadSettings();
            bindEvents();
        }
        
        init();
    })();
</script>
</body>
</html>
